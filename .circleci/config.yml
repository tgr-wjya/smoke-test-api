version: 2.1

orbs:
  codecov: codecov/codecov@5.4.3

jobs:
  test:
    docker:
      - image: oven/bun:latest
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-{{ checksum "bun.lockb" }}
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - save_cache:
          key: bun-deps-{{ checksum "bun.lockb" }}
          paths:
            - node_modules
      - run:
          name: Run tests with coverage
          command: bun test --coverage --coverage-reporter=lcov
      - codecov/upload

workflows:
  quality-check:
    jobs:
      - test:
          filters:
            branches:
              only:
                - main
                - dev